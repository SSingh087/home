<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shashwat Singh | Place</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #ffb347; --bg: #1a1230; --card: rgba(255,255,255,.06); }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 20% 0%, #3a2150 0%, var(--bg) 55%); color: #fff; font-family: 'Outfit', sans-serif; min-height: 100vh; }
    main { max-width: 52rem; margin: 0 auto; padding: 5rem 1.25rem 4rem; }
    nav { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: .6rem; flex-wrap: wrap; padding: .9rem 1.25rem; background: rgba(26,18,48,.8); backdrop-filter: blur(8px); z-index: 2; }
    nav a { color: #fff; text-decoration: none; padding: .35rem .85rem; border-radius: 999px; background: rgba(255,255,255,.1); font: 400 .9rem 'Space Grotesk', sans-serif; }
    nav a:hover { background: rgba(255,179,71,.4); }
    .kicker { color: var(--gold); letter-spacing: .2em; text-transform: uppercase; font-size: .75rem; margin: 0; }
    h1 { font: 600 clamp(2rem, 6vw, 3.4rem)/1.05 'Space Grotesk', sans-serif; margin: .3rem 0 .6rem; }
    .meta { color: rgba(255,255,255,.65); margin: 0 0 1rem; }
    .lead { font-size: 1.1rem; font-weight: 300; line-height: 1.55; max-width: 40rem; }
    .toc { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0 2rem; }
    .toc a { color: #fff; text-decoration: none; border: 1px solid rgba(255,179,71,.6); border-radius: 999px; padding: .3rem .9rem; font-size: .9rem; }
    .toc a:hover { background: rgba(255,179,71,.3); }
    article { background: var(--card); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 1.3rem 1.5rem; margin: 1.2rem 0; scroll-margin-top: 5rem; }
    article:target { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,179,71,.25); }
    article h2 { margin: 0 0 .5rem; font: 600 1.3rem 'Space Grotesk', sans-serif; color: #ffcf8a; }
    article p { margin: .4rem 0; font-weight: 300; line-height: 1.55; }
    h3 { font: 600 .8rem 'Space Grotesk', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.6); margin: 1rem 0 .3rem; }
    ul { margin: .2rem 0; padding-left: 1.2rem; font-weight: 300; line-height: 1.6; }
    .links a { color: var(--gold); margin-right: 1rem; }
    .more { margin-top: 2.5rem; }
  </style>
</head>
<body>
  <nav id="nav"><a href="../index.html">&larr; Home</a><a id="world" href="../explorer/index.html">Back to the map</a><a href="../timeline/index.html">Classic timeline</a></nav>
  <main id="main"></main>
  <script type="module">
    import { PLACES } from '../data/places.js';
    const id = new URLSearchParams(location.search).get('id'), p = PLACES[id], main = document.getElementById('main');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    if (!p) {
      main.innerHTML = '<h1>Pick a place</h1><ul>' + Object.entries(PLACES).map(([k, v]) => `<li><a style="color:#ffb347" href="?id=${k}">${esc(v.name)}</a></li>`).join('') + '</ul>';
    } else {
      document.title = `Shashwat Singh | ${p.name}`;
      document.getElementById('world').href = `../${p.world}/index.html`;
      document.getElementById('world').textContent = p.world === 'explorer' ? 'Back to the Education island' : 'Back to the Experience planet';
      main.innerHTML = `<p class="kicker">${p.world === 'explorer' ? 'Education' : 'Experience'}</p><h1>${esc(p.name)}</h1>
        <p class="meta">${esc(p.country)} · ${esc(p.period)}</p><p class="lead">${esc(p.summary)}</p>
        <div class="toc">${p.items.map(i => `<a href="#${i.id}">${esc(i.title)}</a>`).join('')}</div>
        ${p.items.map(i => `<article id="${i.id}"><h2>${esc(i.title)}</h2><p>${esc(i.summary)}</p>
          ${i.points?.length ? '<h3>What it involved</h3><ul>' + i.points.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}
          ${i.related?.length ? '<h3>Related publications</h3><ul>' + i.related.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}
          ${i.links?.length ? '<h3>Read more</h3><p class="links">' + i.links.map(([t, h]) => `<a href="${h}">${esc(t)} &rarr;</a>`).join('') + '</p>' : ''}</article>`).join('')}`;
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    }
  </script>
</body>
</html>
