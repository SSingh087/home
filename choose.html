<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shashwat Singh | Choose</title>
  <style>
    html,body{margin:0;height:100%;background:rgb(20,10,30);color:#fff;font-family:system-ui,sans-serif}
    main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:16px;box-sizing:border-box;text-align:center}
    h1{font-weight:300;margin:0}
    .opts{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
    a.opt{display:block;width:240px;padding:1.5rem;border:1px solid rgba(255,255,255,.4);border-radius:14px;color:#fff;text-decoration:none;transition:.2s}
    a.opt:hover{background:rgba(255,255,255,.12);transform:translateY(-4px)}
    a.opt b{display:block;font-size:1.4rem;margin-bottom:.5rem}
    a.opt span{font-size:.9rem;opacity:.75}
  </style>
</head>
<body>
<main>
  <h1>How would you like to visit?</h1>
  <div class="opts">
    <a class="opt" href="./homepage/index.html"><b>Explorer</b><span>The 3D, interactive side</span></a>
    <a class="opt" href="./homepage/classic.html"><b>Current site</b><span>The standard homepage</span></a>
  </div>
</main>
</body>
</html>
